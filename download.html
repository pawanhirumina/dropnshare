<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download File - Drag & Share</title>
    <link rel="shortcut icon" href="./src/img/favicon.png" type="image/png">


  <link rel="stylesheet" href="./src/css/index.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div id="toast-container"></div>

  <header>
    <div>
      <p>v1.2</p>
    </div>
    <div class="links">
      <a href="/index.html">Upload</a> /
      <a href="/about.html">About</a> /
      <a href="https://github.com/pawanhirumina/drop-n-share/issues" id="report-a-bug">Report a Bug</a>
    </div>
  </header>

  <div class="download-container">
    <h1>Download File</h1>
    <p class="description">Type the 6-digit access code you received  and click 'Get File' to start the download</p>

    <div class="code-inputs">
      <input type="text" id="code-input" class="code-input" maxlength="6" placeholder="ABCDEF" autofocus />
    </div>

    <button id="download-btn" class="download-btn">Get File</button>

    <div id="download-result"></div>
  </div>

  <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
