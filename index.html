  <link rel="stylesheet" href="./src/css/index.css">

</head>

<body>
  <header>
    <div>
      <p>

    <div class="links">
      <a href="#">about</a>

      <a href="#">report</a>

  <div class="container">
    <h1>Drag & Share</h1>

    <div class="drop-zone" id="drop-zone">

  </div>
