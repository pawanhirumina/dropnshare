<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop & Share</title>
  <link rel="stylesheet" href="./src/css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


</head>

<body>


  <div id="toast-container">

  </div>

  <header>
    <div>
      <p>v1.0</p>
    </div>
    <div class="links">
      <a href="/d.html" id="download-link">Download</a>/
      <a href="#" id="report-a-bug">Report a Bug</a>
    </div>
  </header>

  <div class="container">
    <h1>Drop & Share</h1>
    <p class="description">Drag & drop your files below or click the box to upload them. You can remove any file before
      uploading.</p>

    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-content">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--slate-650--)" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p>Drag & Drop Files Here or Click to Upload</p>
        <p class="file-types">Supports all file types (max 50MB)</p>
      </div>
    </div>

    <input type="file" id="file-input" multiple style="display: none;">

    <div class="upload-progress" id="upload-progress" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-text" id="progress-text">Uploading...</p>
    </div>

    <ul class="file-list" id="file-list"></ul>

    <button id="upload-btn">Upload All Files</button>
  </div>

  <!-- Modal for showing access codes -->
  <div class="modal" id="result-modal">
    <div class="modal-content">
      <h2>Upload Complete!</h2>
      <div id="modal-codes"></div>
      <div class="modal-actions">
        <button id="copy-all">Copy All Codes</button>
        <button id="close-modal">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
